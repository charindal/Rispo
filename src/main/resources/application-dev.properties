# ========================
# Development Profile Configuration
# Use this profile for local development with Docker services
# Run with: mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ========================

# Application name
spring.application.name=rispo

# Database configuration (Docker container on localhost:5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/rispo
spring.datasource.username=rispo_admin
spring.datasource.password=R!#po123##
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Redis Cache configuration (Docker container on localhost:6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.data.redis.repositories.enabled=false

# RabbitMQ configuration (Docker container on localhost:5672)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rispo_admin
spring.rabbitmq.password=R!#po123##

# ========================
# Development Settings
# ========================

# Actuator endpoints (more exposed for development)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=false
management.metrics.export.prometheus.enabled=false

# Disable tracing for local development (no OpenTelemetry)
management.tracing.enabled=false
management.otlp.tracing.endpoint=

# Development logging
logging.level.root=INFO
logging.level.za.co.infratech.rispo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Hot reload support
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
