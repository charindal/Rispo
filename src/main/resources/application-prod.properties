# Production Profile Configuration

# Application
spring.application.name=rispo
server.port=8080

# Database connection for production (using container names)
spring.datasource.url=jdbc:postgresql://rispo-db:5432/rispo
spring.datasource.username=rispo_admin
spring.datasource.password=R!#po123##
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Redis connection for production (using container name)
spring.data.redis.host=rispo-redis
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.data.redis.repositories.enabled=false

# Redis Session (for horizontal scaling)
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.timeout=30m

# RabbitMQ connection for production (using container name)
spring.rabbitmq.host=rispo-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=rispo_admin
spring.rabbitmq.password=R!#po123##

# Production mode
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator - restricted in production
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.root=INFO
logging.level.za.co.infratech.rispo=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Session timeout
server.servlet.session.timeout=30m

# Connection pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Redis optimizations
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
