name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================
  # Build and Push Docker Image
  # ========================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ========================
  # Deploy to VPS
  # ========================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to application directory
            cd /opt/rispo || { echo "❌ Directory /opt/rispo not found"; exit 1; }
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Log in to GitHub Container Registry
            echo "🔐 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest Docker image
            echo "🐳 Pulling Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Update environment file with new image tag
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env.prod
            
            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down app-1 app-2 || true
            
            # Start new containers with zero-downtime deployment
            echo "🔄 Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate app-1 app-2
            
            # Wait for health checks
            echo "⏳ Waiting for health checks..."
            sleep 15
            
            # Verify deployment
            echo "✅ Verifying deployment..."
            if docker compose -f docker-compose.prod.yml ps | grep -q "unhealthy"; then
              echo "❌ Health check failed! Rolling back..."
              docker compose -f docker-compose.prod.yml logs app-1 app-2
              exit 1
            fi
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=72h" || true
            
            echo "✅ Deployment completed successfully!"
            
            # Display running containers
            docker compose -f docker-compose.prod.yml ps

      - name: Deployment notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to VPS: ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # ========================
  # Database Backup (runs after successful deployment)
  # ========================
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    
    steps:
      - name: Trigger Database Backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/rispo
            ./scripts/backup.sh
            echo "✅ Backup completed!"
