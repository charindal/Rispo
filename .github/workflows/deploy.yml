name: Build and Deploy to VPS

on:
  push:
    branches:
      - main          # Production deployment
      - production    # Production deployment
      - development   # Test/Dev deployment
      - dev           # Test/Dev deployment
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================
  # Build and Push Docker Image
  # ========================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-name-lower: ${{ steps.lower.outputs.repository }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        id: lower
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ========================
  # Deploy to Test VPS (development branch)
  # ========================
  deploy-test:
    name: Deploy to Test VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/dev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Test VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -e

            echo "🚀 Starting TEST deployment from development branch..."

            REPO="${{ github.repository }}"
            APP_DIR="$HOME/rispo-test"

            # ── Bootstrap on first run (own folder, isolated from prod) ──────
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 First run — bootstrapping $APP_DIR..."
              rm -rf "$APP_DIR"
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest code from development..."
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git
            git fetch origin
            git checkout development 2>/dev/null || git checkout -b development origin/development
            git pull origin development

            echo "🔐 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🐳 Pulling Docker image..."
            docker pull ghcr.io/charindal/rispo:development || \
            docker pull ghcr.io/charindal/rispo:latest

            echo "🔄 Performing zero-downtime deployment..."
            export DOCKER_IMAGE=ghcr.io/charindal/rispo
            export IMAGE_TAG=development

            # Start all services (creates new containers, keeps old running)
            # Scoped to the rispo-test compose project only — never touches rispo-prod
            docker compose -f docker-compose.test.yml up -d --no-recreate

            # Force recreate only the app with zero-downtime
            echo "📦 Updating application container..."
            docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 60 app

            # Wait for health checks
            echo "⏳ Waiting for health checks (60s max)..."
            timeout=60
            while [ $timeout -gt 0 ]; do
              health=$(docker inspect --format='{{.State.Health.Status}}' rispo-test-app 2>/dev/null || echo "starting")
              if [ "$health" = "healthy" ]; then
                echo "✅ Application is healthy!"
                break
              fi
              echo "Waiting for app to be healthy... ($timeout seconds remaining, current: $health)"
              sleep 5
              timeout=$((timeout - 5))
            done

            if [ $timeout -le 0 ]; then
              echo "⚠️ Warning: Health check timeout, but continuing..."
            fi

            # Remove only dangling/orphaned containers (not running ones)
            echo "🧹 Cleaning up orphaned containers..."
            docker container prune -f || true

            echo "✅ TEST deployment completed!"
            docker compose -f docker-compose.test.yml ps

  # ========================
  # Deploy to Production VPS (main branch)
  # ========================
  deploy-prod:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -e

            echo "🚀 Starting PRODUCTION deployment..."

            REPO="${{ github.repository }}"
            APP_DIR="$HOME/rispo-prod"

            # ── Bootstrap on first run (own folder, isolated from test) ──────
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 First run — bootstrapping $APP_DIR..."
              rm -rf "$APP_DIR"
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git "$APP_DIR"
              echo "⚠️ Remember to place .env.prod in $APP_DIR before the first compose up!"
            fi

            cd "$APP_DIR"

            # Pull latest changes
            echo "📥 Pulling latest code..."
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git
            git fetch origin
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git pull origin main

            # Log in to GitHub Container Registry
            echo "🔐 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest Docker image
            echo "🐳 Pulling Docker image..."
            docker pull ghcr.io/charindal/rispo:latest

            # Update environment file with new image tag
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env.prod

            # Stop and remove old containers
            # Scoped to the rispo-prod compose project only — never touches rispo-test
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down app-1 app-2 || true

            # Start new containers with zero-downtime deployment
            echo "🔄 Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate app-1 app-2

            # Wait for health checks
            echo "⏳ Waiting for health checks..."
            sleep 15

            # Verify deployment
            echo "✅ Verifying deployment..."
            if docker compose -f docker-compose.prod.yml ps | grep -q "unhealthy"; then
              echo "❌ Health check failed! Rolling back..."
              docker compose -f docker-compose.prod.yml logs app-1 app-2
              exit 1
            fi

            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f || true

            echo "✅ PRODUCTION deployment completed successfully!"

            # Display running containers
            docker compose -f docker-compose.prod.yml ps

      - name: Production Deployment notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production Deployment: ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # ========================
  # Database Backup (runs after successful production deployment)
  # ========================
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: success()
    
    steps:
      - name: Trigger Database Backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd "$HOME/rispo-prod"
            ./scripts/backup.sh
            echo "✅ Backup completed!"
