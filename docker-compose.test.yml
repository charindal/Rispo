services:
  # ========================
  # Traefik Reverse Proxy (HTTP only - no SSL)
  # ========================
  traefik:
    image: traefik:v2.11
    container_name: rispo-traefik
    command:
      # API and Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=rispo-net"
      
      # Entry Points (HTTP only for testing)
      - "--entrypoints.web.address=:80"
      
      # Logs
      - "--log.level=INFO"
      - "--accesslog=true"
      
      # Metrics
      - "--metrics.prometheus=true"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rispo-net
    restart: unless-stopped

  # ========================
  # Database
  # ========================
  db:
    image: postgres:17
    container_name: rispo-db
    environment:
      POSTGRES_DB: ${DB_NAME:-rispo}
      POSTGRES_USER: ${DB_USER:-rispo_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-RispoTest123}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - rispo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rispo_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================
  # Redis Cache
  # ========================
  redis:
    image: redis:7-alpine
    container_name: rispo-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - rispo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================
  # RabbitMQ Message Queue
  # ========================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rispo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rispo_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-RispoTest123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rispo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=PathPrefix(`/rabbitmq`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.priority=100"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # ========================
  # Rispo Application
  # ========================
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/charindal/rispo}:${IMAGE_TAG:-development}
    container_name: rispo-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-rispo}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-rispo_admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-RispoTest123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rispo_admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-RispoTest123}
      JWT_SECRET: ${JWT_SECRET:-test_jwt_secret_key_for_testing_only_change_in_production_12345678}
      INSTANCE_ID: "app-main"
    networks:
      - rispo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rispo-app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.rispo-app.entrypoints=web"
      - "traefik.http.routers.rispo-app.priority=1"
      - "traefik.http.services.rispo-app.loadbalancer.server.port=8080"
      # Health check for load balancer
      - "traefik.http.services.rispo-app.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.rispo-app.loadbalancer.healthcheck.interval=10s"

  # ========================
  # Observability Stack
  # ========================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: rispo-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - rispo-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: rispo-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=http://135.125.133.211/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./telemetry/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-data:/prometheus
    networks:
      - rispo-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.priority=100"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  tempo:
    image: grafana/tempo:latest
    container_name: rispo-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    networks:
      - rispo-net
    restart: unless-stopped
    user: root

  loki:
    image: grafana/loki:latest
    container_name: rispo-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - rispo-net
    restart: unless-stopped
    user: root

  grafana:
    image: grafana/grafana:latest
    container_name: rispo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: "135.125.133.211"
      GF_SERVER_ROOT_URL: "http://135.125.133.211/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - rispo-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.priority=100"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: rispo-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://rispo_admin:RispoTest123@db:5432/rispo?sslmode=disable"
    networks:
      - rispo-net
    restart: unless-stopped
    depends_on:
      - db

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: rispo-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - rispo-net
    restart: unless-stopped
    depends_on:
      - redis

  # Node Exporter for system metrics (CPU, memory, disk)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: rispo-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - rispo-net
    restart: unless-stopped

  # cAdvisor for Docker container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: rispo-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - rispo-net
    restart: unless-stopped
    privileged: true

# ========================
# Shared Resources
# ========================
volumes:
  db-data:
  redis-data:
  rabbitmq-data:
  grafana-data:
  prometheus-data:
  tempo-data:
  loki-data:

networks:
  rispo-net:
    name: rispo-net
    driver: bridge
