version: "3.9"

services:
  # ========================
  # Database
  # ========================
  db:
    image: postgres:17
    container_name: rispo-db
    environment:
      POSTGRES_DB: rispo
      POSTGRES_USER: rispo_admin
      POSTGRES_PASSWORD: R!#po123##
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - rispo-net

  # ========================
  # Rispo Application
  # ========================
  app:
    build: .
    container_name: rispo-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rispo
      SPRING_DATASOURCE_USERNAME: rispo_admin
      SPRING_DATASOURCE_PASSWORD: R!#po123##
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    ports:
      - "8080:8080"
    restart: on-failure
    networks:
      - rispo-net

# ========================
# Shared Resources
# ========================
volumes:
  db-data:

networks:
  rispo-net:
    name: rispo-net
    driver: bridge
